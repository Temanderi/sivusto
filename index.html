<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koodi Testisivu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
            padding-top: 50px;
        }

        .box {
            background: #2c2c2c;
            width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }

        button {
            background: #0078d7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #005fa3;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Koodi HTML Testi</h1>
        <p>Tämä on yksinkertainen testisivu.</p>

        <button onclick="naytaViesti()">
            Klikkaa minua
        </button>

        <p id="tulos"></p>
    </div>

    <script>
        function naytaViesti() {
            document.getElementById("tulos").textContent =
                "JavaScript toimii!";
        }
    </script>
</body>
</html>
