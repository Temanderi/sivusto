<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogi</title>

    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <img src="banner.png" alt="Banner" class="banner">

        <div id="posts"></div>

        <!-- KOMMENTIT -->
        <div id="disqus_thread"></div>

    </div>

    <script src="script.js"></script>

    <!-- DISQUS CONFIG -->
    <script>
    var disqus_config = function () {
        this.page.url = window.location.href;
        this.page.identifier = "blogi-main";
    };
    </script>

    <!-- DISQUS EMBED -->
    <script>
    (function() {
        var d = document, s = d.createElement('script');
        s.src = 'https://taikatemppu-link.disqus.com/embed.js';
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
    })();
    </script>

    <!-- COMMENT COUNT (valinnainen) -->
    <script id="dsq-count-scr" src="//taikatemppu-link.disqus.com/count.js" async></script>

</body>
</html>
