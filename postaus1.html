<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postaus</title>

    <link rel="stylesheet" href="./style.css?v=30">
</head>

<body class="post-page">

    <main class="post-wrapper">

        <!-- 🔙 TAKAISIN-LINKKI -->
        <a href="./index.html" class="back-link">← Takaisin etusivulle</a>


        <!-- =============================== -->
        <!-- 📝 MUOKKAA POSTAUSTA TÄSTÄ ALAS -->
        <!-- =============================== -->

        <article class="post-card">

            <!-- OTSIKKO -->
            <h1 class="post-title">
                Tämä on postauksen otsikko
            </h1>

            <!-- PÄIVÄMÄÄRÄ, VALINNAINEN -->
            <!-- 
                Jos haluat päivämäärän näkyviin, kirjoita se tähän:

                <time class="post-date" datetime="2026-06-02">2.6.2026</time>

                Jos et halua päivämäärää näkyviin, jätä time-kohta tyhjäksi näin:
            -->
            <time class="post-date" datetime=""></time>

            <!-- POSTAUKSEN TEKSTI -->
            <div class="post-content">

                <p>
                    Tässä kirjoitat itse postauksen tekstin. Voit muokata tätä vapaasti.
                </p>

                <p>
                    Jos haluat lisätä uuden kappaleen, kopioi uusi &lt;p&gt;...&lt;/p&gt;-kohta tähän alle.
                </p>

            </div>

        </article>

        <!-- =============================== -->
        <!-- 📝 MUOKATTAVA POSTAUS LOPPUU    -->
        <!-- =============================== -->


        <!-- 💬 KOMMENTIT -->
        <section class="comments-card">

            <h2 class="comment-title">
                Kommentit tähän postaukseen
            </h2>

            <div id="disqus_thread"></div>

        </section>

    </main>


    <!-- DISQUS -->
    <script>
    var disqus_config = function () {
        this.page.url = window.location.href;
        this.page.identifier = window.location.pathname;
    };

    (function() {
        var d = document;
        var s = d.createElement('script');

        s.src = 'https://taikatemppu-link.disqus.com/embed.js';
        s.setAttribute('data-timestamp', +new Date());

        (d.head || d.body).appendChild(s);
    })();
    </script>

    <noscript>
        Ota JavaScript käyttöön nähdäksesi kommentit.
    </noscript>

</body>
</html>
