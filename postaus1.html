<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postaus</title>

    <!-- CSS pitää olla HEAD-osiossa -->
    <link rel="stylesheet" href="./style.css?v=25">
</head>

<body class="post-page">

    <main class="post-wrapper">

        <!-- 🔙 Takaisin -->
        <a href="./index.html" class="back-link">← Takaisin etusivulle</a>

        <!-- 📝 POSTAUS -->
        <article class="post-card">

            <!-- MUOKKAA OTSIKKO TÄSTÄ -->
            <h1 class="post-title">
                Tämä on postauksen otsikko
            </h1>

            <!-- MUOKKAA TEKSTI TÄSTÄ -->
            <div class="post-content">

                <p>
                    Tässä kirjoitat itse postauksen tekstin. Voit muokata tätä vapaasti.
                </p>

                <p>
                    Jos haluat uuden kappaleen, kopioi uusi &lt;p&gt;...&lt;/p&gt;-kohta tähän alle.
                </p>

            </div>

        </article>

        <!-- 💬 KOMMENTIT -->
        <section class="comments-card">

            <h2 class="comment-title">
                Kommentit tähän postaukseen
            </h2>

            <div id="disqus_thread"></div>

        </section>

    </main>

    <!-- DISQUS -->
    <script>
    var disqus_config = function () {
        this.page.url = window.location.href;
        this.page.identifier = window.location.pathname;
    };

    (function() {
        var d = document;
        var s = d.createElement('script');

        s.src = 'https://taikatemppu-link.disqus.com/embed.js';
        s.setAttribute('data-timestamp', +new Date());

        (d.head || d.body).appendChild(s);
    })();
    </script>

    <noscript>
        Ota JavaScript käyttöön nähdäksesi kommentit.
    </noscript>

</body>
</html>
